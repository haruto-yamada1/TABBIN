name: CI

env:
  FLAKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  # A unique group also avoids replacing pending pushes when cancellation is off.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Verify Firefox source contract
        run: bun run verify:firefox-source

      - name: Run type checking
        run: bun run compile

      - name: Run formatter check
        run: bun run format:check

      - name: Run lint
        run: bun run lint

      - name: Run architecture check
        run: bun run arch:check

      - name: Run secretlint
        run: bun run secretlint

  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package Chrome extension
        run: bun run zip

      - name: Build and package Firefox extension
        run: bun run zip:firefox

      - name: Report extension artifact size
        run: bun run size:report

      - name: Upload artifact size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-size-report
          path: .output/size-report
          if-no-files-found: error
          retention-days: 30

      - name: Archive build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-build-chrome
          path: .output/chrome-mv3
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Verify generated manifest version
        run: bun run verify:app-version

      - name: Verify persistence release compatibility metadata
        run: bun run verify:persistence-release-compatibility

      - name: Verify production network policy
        run: bun run verify:production-network-policy

      - name: Verify Firefox artifact contract
        run: bun run verify:firefox-artifact

  # Keep the existing required check name; coverage runs the full suite.
  run-tests:
    name: Run Vitest Tests
    runs-on: ubuntu-latest
    needs: [coverage]
    if: ${{ !cancelled() }}
    steps:
      - name: Require the complete covered suite to pass
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: test "$COVERAGE_RESULT" = success

  coverage:
    name: Coverage Thresholds
    runs-on: ubuntu-latest
    env:
      FLAKE_REPORT_PATH: test-results/flake-coverage.json
      FLAKE_SUITE: coverage

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run coverage with thresholds
        run: bun run test:coverage

      - name: Upload normalized flake observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-current-coverage
          path: test-results/flake-coverage.json
          if-no-files-found: warn
          retention-days: 14

  indexeddb-browser-semantics:
    name: IndexedDB Browser Semantics
    runs-on: ubuntu-latest
    env:
      FLAKE_REPORT_PATH: test-results/flake-indexeddb-browser-semantics.json
      FLAKE_SUITE: indexeddb-browser-semantics

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ci-perf-v1-${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('.bun-version', 'bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: Run IndexedDB browser semantics
        run: bun run test:indexeddb:browsers

      - name: Run MV3 persistence worker restart
        env:
          FLAKE_REPORT_PATH: test-results/mv3-worker/flake-mv3-worker.json
          FLAKE_SUITE: persistence-mv3-worker
        run: bunx playwright test --project=extension e2e/persistence-worker-restart.extension.spec.ts --output=test-results/mv3-worker

      - name: Upload normalized flake observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-current-indexeddb-browser-semantics
          path: test-results/flake-indexeddb-browser-semantics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MV3 worker flake observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-current-persistence-mv3-worker
          path: test-results/mv3-worker/flake-mv3-worker.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check failure evidence budget
        id: flake-evidence
        if: ${{ !cancelled() }}
        run: bun tools/testing/check-flake-evidence.ts test-results

      - name: Upload bounded failure evidence
        if: ${{ !cancelled() && steps.flake-evidence.outputs.available == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-evidence-indexeddb-browser-semantics
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 7

  e2e-accessibility:
    name: E2E Accessibility (axe)
    runs-on: ubuntu-latest
    env:
      FLAKE_REPORT_PATH: test-results/flake-e2e-accessibility.json
      FLAKE_SUITE: e2e-accessibility

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run axe accessibility E2E tests
        run: bun run e2e:a11y

      - name: Upload normalized flake observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-current-e2e-accessibility
          path: test-results/flake-e2e-accessibility.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check failure evidence budget
        id: flake-evidence
        if: ${{ !cancelled() }}
        run: bun tools/testing/check-flake-evidence.ts test-results

      - name: Upload bounded failure evidence
        if: ${{ !cancelled() && steps.flake-evidence.outputs.available == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-evidence-e2e-accessibility
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 7

  firefox-extension-smoke:
    name: Firefox Extension Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      FLAKE_REPORT_PATH: test-results/flake-firefox-extension-smoke.json
      FLAKE_SUITE: firefox-extension-smoke

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Firefox
        run: bunx playwright install --with-deps firefox

      - name: Install pinned geckodriver
        run: |
          curl -fL --retry 2 \
            --output /tmp/geckodriver-v0.37.1-linux64.tar.gz \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          echo "e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  /tmp/geckodriver-v0.37.1-linux64.tar.gz" | sha256sum --check -
          tar -xzf /tmp/geckodriver-v0.37.1-linux64.tar.gz -C /tmp
          chmod +x /tmp/geckodriver

      - name: Resolve Playwright Firefox executable
        id: firefox-executable
        run: |
          FIREFOX_EXECUTABLE_PATH=$(bun -e "import { firefox } from '@playwright/test'; console.log(firefox.executablePath())")
          printf 'path=%s\n' "$FIREFOX_EXECUTABLE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Firefox artifact
        run: bun run build:firefox

      - name: Verify Firefox artifact contract
        run: bun run verify:firefox-artifact

      - name: Run Firefox startup smoke
        run: bun run test:firefox:smoke
        env:
          FIREFOX_EXTENSION_SMOKE: '1'

      - name: Run Firefox Persistence v2 migration smoke
        run: bun run test:firefox:indexeddb-smoke
        env:
          FIREFOX_EXECUTABLE_PATH: ${{ steps.firefox-executable.outputs.path }}
          GECKODRIVER_PATH: /tmp/geckodriver

      - name: Upload normalized flake observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-current-firefox-extension-smoke
          path: test-results/flake-firefox-extension-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check failure evidence budget
        id: flake-evidence
        if: ${{ !cancelled() }}
        run: bun tools/testing/check-flake-evidence.ts test-results

      - name: Upload bounded failure evidence
        if: ${{ !cancelled() && steps.flake-evidence.outputs.available == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-evidence-firefox-extension-smoke
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 7

  performance-budget:
    name: Saved Tabs Performance Budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ci-perf-v1-${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('.bun-version', 'bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Measure representative Saved Tabs workloads
        run: xvfb-run -a bun run perf:budget

      - name: Evaluate performance budgets
        if: ${{ !cancelled() }}
        run: bun run perf:report --input test-results/budget --output reports/performance-budget --baseline docs/testing/performance-budget-baseline.json

      - name: Upload performance observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saved-tabs-performance-budget
          path: |
            test-results/budget/**/budget-samples.json
            reports/performance-budget
          if-no-files-found: error
          retention-days: 30

  storybook-visual:
    name: Storybook Visual Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Install Bun extraction dependency
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compare Storybook screens and check repeatability
        run: bun run test:visual --repeat-each=3

      - name: Upload visual comparisons
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storybook-visual-comparisons
          path: |
            playwright-report/visual
            test-results/visual
            test-results/visual-report.json
          if-no-files-found: error
          retention-days: 14

  flake-diagnostics:
    name: Flaky Test Diagnostics
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - coverage
      - indexeddb-browser-semantics
      - e2e-accessibility
      - firefox-extension-smoke
    continue-on-error: true
    env:
      FLAKE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    permissions:
      contents: read
      # Read only retained normalized artifacts; fork PRs need no extra secret.
      actions: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download current normalized observations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: flake-current-*
          path: reports/flakes/current
          merge-multiple: true

      - name: Fetch bounded recent history
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/testing/fetch-flake-history.ts reports/flakes/history

      - name: Summarize flaky test candidates
        if: ${{ !cancelled() }}
        run: bun tools/testing/report-flakes.ts --current reports/flakes/current --history reports/flakes/history --output reports/flakes

      - name: Upload normalized flake summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-summary
          path: |
            reports/flakes/summary.json
            reports/flakes/report.md
          if-no-files-found: warn
          retention-days: 14
