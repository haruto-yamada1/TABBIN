name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Verify Firefox source contract
        run: bun run verify:firefox-source

      - name: Run type checking
        run: bun run compile

      - name: Run formatter check
        run: bun run check

      - name: Run architecture check
        run: bun run arch:check

      - name: Run secretlint
        run: bun run secretlint

  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run build

      - name: Build Firefox extension
        run: bun run build:firefox

      - name: Archive build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-build-chrome
          path: .output/chrome-mv3
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Verify generated manifest version
        run: bun run verify:app-version

      - name: Verify persistence release compatibility metadata
        run: bun run verify:persistence-release-compatibility

      - name: Verify production network policy
        run: bun run verify:production-network-policy

      - name: Verify Firefox artifact contract
        run: bun run verify:firefox-artifact

  run-tests-shard-1:
    name: Run Vitest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (shard 1/2)
        run: bun run test --shard=1/2

  run-tests-shard-2:
    name: Run Vitest Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (shard 2/2)
        run: bun run test --shard=2/2

  coverage:
    name: Coverage Thresholds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run coverage with thresholds
        run: bun run test:coverage

  indexeddb-browser-semantics:
    name: IndexedDB Browser Semantics
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: Run IndexedDB browser semantics
        run: bun run test:indexeddb:browsers

  e2e-accessibility:
    name: E2E Accessibility (axe)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run axe accessibility E2E tests
        run: bun run e2e:a11y

  firefox-extension-smoke:
    name: Firefox Extension Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Verify toolchain versions
        run: bun run verify:toolchain-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Firefox
        run: bunx playwright install --with-deps firefox

      - name: Install pinned geckodriver
        run: |
          curl -fL --retry 2 \
            --output /tmp/geckodriver-v0.37.1-linux64.tar.gz \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          echo "e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  /tmp/geckodriver-v0.37.1-linux64.tar.gz" | sha256sum --check -
          tar -xzf /tmp/geckodriver-v0.37.1-linux64.tar.gz -C /tmp
          chmod +x /tmp/geckodriver

      - name: Resolve Playwright Firefox executable
        id: firefox-executable
        run: echo "path=$(bun -e \"import { firefox } from '@playwright/test'; console.log(firefox.executablePath())\")" >> "$GITHUB_OUTPUT"

      - name: Build Firefox artifact
        run: bun run build:firefox

      - name: Verify Firefox artifact contract
        run: bun run verify:firefox-artifact

      - name: Run Firefox startup smoke
        run: bun run test:firefox:smoke
        env:
          FIREFOX_EXTENSION_SMOKE: '1'

      - name: Run Firefox Persistence v2 migration smoke
        run: bun run test:firefox:migration-smoke
        env:
          FIREFOX_EXECUTABLE_PATH: ${{ steps.firefox-executable.outputs.path }}
          GECKODRIVER_PATH: /tmp/geckodriver

      - name: Upload Firefox smoke test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firefox-smoke-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
