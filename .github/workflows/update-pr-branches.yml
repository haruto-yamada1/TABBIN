name: Update PR Branches

on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: update-pr-branches-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-pr-branches:
    name: Update Open PR Branches
    runs-on: ubuntu-latest

    steps:
      - name: Update open pull requests based on develop
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseBranch = 'develop';
            const repoFullName = `${owner}/${repo}`;

            const openPulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                base: baseBranch,
                per_page: 100,
              },
            );

            const updated = [];
            const skipped = [];
            const failed = [];

            for (const pull of openPulls) {
              if (
                pull.user.login === 'renovate[bot]' ||
                pull.head.ref.startsWith('renovate/')
              ) {
                skipped.push({ number: pull.number, reason: 'renovate' });
                continue;
              }

              if (pull.draft) {
                skipped.push({ number: pull.number, reason: 'draft' });
                continue;
              }

              if (pull.head.repo?.full_name !== repoFullName) {
                skipped.push({ number: pull.number, reason: 'fork' });
                continue;
              }

              if (pull.head.ref === baseBranch) {
                skipped.push({
                  number: pull.number,
                  reason: 'head branch is develop',
                });
                continue;
              }

              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pull.number,
                  expected_head_sha: pull.head.sha,
                });

                updated.push({
                  number: pull.number,
                  head: pull.head.ref,
                });
              } catch (error) {
                const status = error.status ?? 'unknown';
                const message =
                  error.response?.data?.message ?? error.message ?? 'unknown';

                if (
                  status === 422 &&
                  /not behind|update is not possible|no longer satisfied/i.test(
                    message,
                  )
                ) {
                  skipped.push({
                    number: pull.number,
                    reason: message,
                  });
                  continue;
                }

                failed.push({
                  number: pull.number,
                  reason: message,
                });
              }
            }

            const lines = [
              '# PR branch auto-update summary',
              '',
              `- repository: ${repoFullName}`,
              `- base branch: ${baseBranch}`,
              `- scanned: ${openPulls.length}`,
              `- updated: ${updated.length}`,
              `- skipped: ${skipped.length}`,
              `- failed: ${failed.length}`,
              '',
            ];

            if (updated.length > 0) {
              lines.push('## Updated');
              lines.push(
                ...updated.map((item) => `- #${item.number} (${item.head})`),
              );
              lines.push('');
            }

            if (skipped.length > 0) {
              lines.push('## Skipped');
              lines.push(
                ...skipped.map(
                  (item) => `- #${item.number}: ${item.reason}`,
                ),
              );
              lines.push('');
            }

            if (failed.length > 0) {
              lines.push('## Failed');
              lines.push(
                ...failed.map(
                  (item) => `- #${item.number}: ${item.reason}`,
                ),
              );
            }

            core.summary.addRaw(lines.join('\n'));
            await core.summary.write();

            if (failed.length > 0) {
              core.setFailed(
                `Failed to update ${failed.length} pull request(s).`,
              );
            }
