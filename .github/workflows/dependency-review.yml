name: Dependency Review

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read base lockfile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "$BASE_SHA:bun.lock" > "$RUNNER_TEMP/base-bun.lock"
      - name: Require security review for patch changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- patches/
      - name: Review Bun resolved dependency changes
        env:
          BASE_LOCK: ${{ runner.temp }}/base-bun.lock
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/scripts/run-dependency-review.ts
      - name: Review GitHub Dependency Graph changes
        if: ${{ !cancelled() }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          allow-licenses: 0BSD, Apache-2.0, Artistic-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, BSL-1.0, CC0-1.0, CC-BY-3.0, CC-BY-4.0, ISC, MIT, OFL-1.1, Python-2.0, Unlicense, Zlib
          license-check: true
          vulnerability-check: true
          comment-summary-in-pr: never
          warn-only: false
          show-openssf-scorecard: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
