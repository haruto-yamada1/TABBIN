name: Academy Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'

permissions:
  contents: read

concurrency:
  group: academy-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  academy-chromium:
    name: Academy Chromium integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run academy:check
      - run: bunx playwright install --with-deps chromium
      - run: bun run academy:e2e --list
      - run: bun run academy:e2e
      - run: bun run academy:check .output/chrome-mv3
      - name: Retain integration evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: academy-chromium-evidence
          path: test-results/academy-chromium
          if-no-files-found: warn
          retention-days: 7

  academy-firefox:
    name: Academy Firefox release rehearsal
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps firefox
      - name: Install pinned geckodriver
        run: |
          curl -fL --retry 2 --output /tmp/geckodriver.tar.gz https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          echo "e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  /tmp/geckodriver.tar.gz" | sha256sum --check -
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp
      - name: Resolve Firefox executable
        run: |
          academy_firefox_binary=$(bun -e "import { firefox } from '@playwright/test'; console.log(firefox.executablePath())")
          printf 'FIREFOX_EXECUTABLE_PATH=%s\n' "$academy_firefox_binary" >> "$GITHUB_ENV"
      - run: bun run verify:firefox-smoke-environment
        env:
          GECKODRIVER_PATH: /tmp/geckodriver
      - name: Run required native Academy smoke
        run: bun run test:firefox:smoke e2e/firefox.extension.academy.spec.ts --list && bun run test:firefox:smoke e2e/firefox.extension.academy.spec.ts --output=test-results/academy-firefox
        env:
          FIREFOX_EXTENSION_SMOKE: '1'
          GECKODRIVER_PATH: /tmp/geckodriver
      - name: Retain native release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: academy-firefox-evidence
          path: test-results/academy-firefox
          if-no-files-found: warn
          retention-days: 14
