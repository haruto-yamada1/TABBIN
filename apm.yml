name: TABBIN
version: 1.0.0
description: Shared agent context, skills, prompts, and rules for TABBIN
author: TarouTanakaYokohama
license: UNLICENSED
type: hybrid
target:
- codex
- claude
- cursor
- gemini
- copilot
- opencode
dependencies:
  apm: []
  mcp:
  - name: playwright
    registry: false
    transport: stdio
    command: npx
    args:
    - -y
    - '@playwright/mcp'
  - name: context7
    registry: false
    transport: http
    url: https://mcp.context7.com/mcp
includes: auto
scripts:
  validate: apm compile --validate
  preview: apm compile --dry-run --verbose
  install: apm install
  compile: apm compile
compilation:
  strategy: distributed
  source_attribution: true
  exclude:
  - apm_modules/**
  - .output/**
  - coverage/**
  - playwright-report/**
  - test-results/**
