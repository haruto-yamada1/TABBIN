name: TABBIN
version: 1.0.0
description: Shared agent context, skills, prompts, and rules for TABBIN
author: TarouTanakaYokohama
license: UNLICENSED
type: hybrid
target:
  - codex
  - claude
  - cursor
  - gemini
  - copilot
  - opencode
  - agent-skills
dependencies:
  apm: []
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@playwright/mcp'
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
includes: auto
scripts:
  validate: bun run apm:check
  preview: apm compile --dry-run --verbose
  install: bun run apm:sync
  compile: bun run apm:sync
compilation:
  strategy: distributed
  source_attribution: true
  exclude:
    - apm_modules/**
    - .output/**
    - coverage/**
    - playwright-report/**
    - test-results/**
    - .worktrees/**
